# Template only – never commit real values.
#
#   kubectl -n jubeljukebox create secret generic mongodb-secret \
#     --from-literal=mongo-root-username=root \
#     --from-literal=mongo-root-password="$(openssl rand -base64 32)" \
#     --from-literal=mongo-app-password="$(openssl rand -base64 32 | tr -d '/+=')"
#
# The app connects as the least-privileged user "jubeljukebox" (see mongodb-init.yaml),
# never as root. Use mongo-app-password in MONGODB_URI of jj-app-secret.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
stringData:
  mongo-root-username: "root"
  mongo-root-password: "CHANGE_ME"
  mongo-app-password: "CHANGE_ME"
