apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
type: kubernetes.io/tls
data:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    <Base64 encoded contents of your-domain.crt file>
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN RSA PRIVATE KEY-----
    <Base64 encoded contents of your-domain.key file>
    -----END RSA PRIVATE KEY-----
