apiVersion: apps/v1
kind: Deployment
metadata:
  name: jubeljukebox-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jubeljukebox
  template:
    metadata:
      labels:
        app: jubeljukebox
    spec:
      containers:
        - name: jubeljukebox
          image: ghcr.io/jacolate/jubeljukebox:main
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mongodb-config
                  key: MONGODB_HOST
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: jubeljukebox-config
                  key: NODE_ENV
            - name: VITE_SESSION_CODE
              valueFrom:
                configMapKeyRef:
                  name: jubeljukebox-config
                  key: ENTRY_CODE
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-username
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-password
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jj-api-secret
                  key: CLIENT_ID
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jj-api-secret
                  key: CLIENT_SECRET
      imagePullSecrets:
        - name: ghcr-credentials
