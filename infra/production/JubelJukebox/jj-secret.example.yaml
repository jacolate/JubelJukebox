# Template only – never commit real values (infra/**/*secret*.yaml is gitignored).
# Create the real secret with:
#
#   kubectl -n jubeljukebox create secret generic jj-app-secret \
#     --from-literal=MONGODB_URI='mongodb://jubeljukebox:<APP_PASSWORD>@mongodb-service:27017/songRequests?authSource=songRequests' \
#     --from-literal=ENTRY_CODE='<EVENT CODE>' \
#     --from-literal=ADMIN_USERNAME='dj' \
#     --from-literal=ADMIN_PASSWORD_HASH="$(npm run -s hash-password)" \
#     --from-literal=SPOTIFY_CLIENT_ID='<id>' \
#     --from-literal=SPOTIFY_CLIENT_SECRET='<secret>'
#
# Image pull secret for ghcr.io (token with read:packages only):
#
#   kubectl -n jubeljukebox create secret docker-registry ghcr-credentials \
#     --docker-server=ghcr.io --docker-username=<github user> --docker-password=<token>
apiVersion: v1
kind: Secret
metadata:
  name: jj-app-secret
type: Opaque
stringData:
  MONGODB_URI: "mongodb://jubeljukebox:CHANGE_ME@mongodb-service:27017/songRequests?authSource=songRequests"
  ENTRY_CODE: "CHANGE_ME"
  ADMIN_USERNAME: "dj"
  ADMIN_PASSWORD_HASH: "scrypt$..."
  SPOTIFY_CLIENT_ID: "CHANGE_ME"
  SPOTIFY_CLIENT_SECRET: "CHANGE_ME"
