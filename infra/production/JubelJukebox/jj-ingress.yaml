apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jubeljukebox-ingress
  annotations:
    # TLS certificate from Let's Encrypt via cert-manager (ClusterIssuer "letsencrypt-prod")
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    # Server-sent events for the DJ dashboard
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: kathasagtjazuaron.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jubeljukebox-service
                port:
                  name: http
  tls:
    - hosts:
        - kathasagtjazuaron.de
      secretName: jubeljukebox-tls
