apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jubeljukebox-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "on"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"
spec:
  ingressClassName: nginx
  rules:
    - host: kathasagtjazuaron.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jubeljukebox-service
                port:
                  number: 443
  tls:
    - hosts:
        - kathasagtjazuaron.de  # Replace with your domain
      secretName: tls-secret  # Replace with your TLS secret containing your SSL certificate
