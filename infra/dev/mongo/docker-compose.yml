# Local MongoDB for development: docker compose -f infra/dev/mongo/docker-compose.yml up -d
# Matches MONGODB_URI in .env.example.
services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: dev-root-password
      MONGO_APP_PASSWORD: dev-password
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

volumes:
  mongo-data:
