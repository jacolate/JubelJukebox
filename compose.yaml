# Configure DOMAIN, HTTP_PORT and HTTPS_PORT in .env (see .env.example), then: docker compose up -d --build
# Caddy obtains a Let's Encrypt certificate for DOMAIN automatically (ports 80/443 must be reachable).
# DOMAIN=localhost makes Caddy use its own local certificate authority for testing.
services:
  app:
    build: .
    # Alternatively use the image published by CI instead of building locally:
    # image: ghcr.io/jacolate/jubeljukebox:main
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/jukebox.db
    volumes:
      - app-data:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Not published: only reachable through Caddy.
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. DOMAIN=jukebox.example.com}
    ports:
      # Rootless Podman/Docker needs ports above 1024, e.g. HTTP_PORT=8080 HTTPS_PORT=8443
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

volumes:
  app-data:
  caddy-data:
  caddy-config:
