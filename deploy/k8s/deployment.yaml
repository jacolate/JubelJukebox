apiVersion: apps/v1
kind: Deployment
metadata:
  name: jubeljukebox
spec:
  # Must stay at 1: SQLite file, live updates and rate limits are local to the process.
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jubeljukebox
          image: jubeljukebox
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: jubeljukebox-secret
          volumeMounts:
            - name: data
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jubeljukebox-data
      # For a private image: kubectl -n jubeljukebox create secret docker-registry ghcr-credentials \
      #   --docker-server=ghcr.io --docker-username=<user> --docker-password=<token with read:packages>
      # imagePullSecrets:
      #   - name: ghcr-credentials
